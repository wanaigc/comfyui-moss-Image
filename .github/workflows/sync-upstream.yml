name: Sync upstream moss-image

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时同步一次
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout self
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: main

      - name: Checkout upstream (sparse)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/OpenMOSS/MOSS-Image.git /tmp/upstream
          cd /tmp/upstream
          git sparse-checkout set comfyui/moss-image

      - name: Sync files from upstream comfyui/moss-image
        run: |
          rsync -av --delete \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='README_ZH.md' \
            --exclude='pyproject.toml' \
            --exclude='example_workflows/moss-image-api.json' \
            --exclude='example_workflows/image_moss_sft_int8_t2i.json' \
            /tmp/upstream/comfyui/moss-image/ \
            ./

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No upstream changes to sync."
          else
            git commit -m "chore: sync from OpenMOSS/MOSS-Image (comfyui/moss-image)"
            git push origin HEAD:main 2>&1
          fi
